# CI: typecheck + lint + testes + build a cada push/PR na master.
# O build usa envs dummy — nenhuma pagina conecta no banco em build time
# (rotas sao dinamicas por subdominio/sessao).
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Postgres desde 16/08/2026 (era MySQL/PlanetScale). Envs dummy: nenhum passo
      # do CI conecta no banco — sao so para o Prisma validar o datasource.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/seuconviteia
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/seuconviteia
      AUTH_SECRET: ci-dummy-secret-nao-usar-em-prod
      NEXT_PUBLIC_ROOT_DOMAIN: seuconviteia.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Build de producao
        run: pnpm build
